# 1. Persistent Volume (The physical storage)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app1-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data"
---
# 2. Persistent Volume Claim (The request for storage)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app1-pvc
  namespace: app1-ns
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
