apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: app1-ns
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 5000        # The port other pods use to reach this service, ClusterIP port
    targetPort: 5000  # The port the application is listening on inside the container
  type: ClusterIP